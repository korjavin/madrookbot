version: "3.8"

services:
  madrookbot:
    image: ghcr.io/korjavin/madrookbot:cb7270ca7ba9c78b0104890102a5f956710a8dc2
    container_name: madrookbot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - GPT_TOKEN=${GPT_TOKEN}
      - GPT_KEYWORDS=${GPT_KEYWORDS}
      - GPT_SYSTEM_PROMPT=${GPT_SYSTEM_PROMPT}
      - GPT_MODEL=${GPT_MODEL}
      - GPT_SYSTEM_MSG=${GPT_SYSTEM_MSG}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-1.0}
      - OPENAI_URL=${OPENAI_URL:-https://api.openai.com/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_IMAGE_MODEL=${GEMINI_IMAGE_MODEL:-gemini-2.5-flash-image-preview}
      - OWNER_ID=${OWNER_ID}
      - CLASS_GROUP_ID=${CLASS_GROUP_ID}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      - ELEVENLABS_VOICE_NAME=${ELEVENLABS_VOICE_NAME:-}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID}
      - REVIEW_PERCENTAGE=${REVIEW_PERCENTAGE:-1.0}
      - REVIEW_MIN_LENGTH=${REVIEW_MIN_LENGTH:-130}
      - REVIEW_PROMPT=${REVIEW_PROMPT:-}
      - PARTICIPANTS_IGNORE=${PARTICIPANTS_IGNORE:-}
      - NEWS_COMMENT_PROMPT=${NEWS_COMMENT_PROMPT:-}
      - RANDOM_MESSAGE_PROMPT=${RANDOM_MESSAGE_PROMPT:-}
      - MEMORY_GROUP_ID=${MEMORY_GROUP_ID}
      - MIN_MESSAGE_LENGTH=${MIN_MESSAGE_LENGTH:-20}
      - MESSAGE_COMBINE_WINDOW=${MESSAGE_COMBINE_WINDOW:-90}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL}
      - TOOL_API_URL=${TOOL_API_URL:-http://tool-api:8081}
    volumes:
      - ./data:/bot/data
    restart: unless-stopped
    depends_on:
      - qdrant
      - tool-api

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  tool-api:
    image: ghcr.io/korjavin/madrookbot:cb7270ca7ba9c78b0104890102a5f956710a8dc2
    container_name: tool-api
    restart: unless-stopped
    environment:
      - GPT_TOKEN=${GPT_TOKEN}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-ada-002}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-telegram_messages}
      - TOOL_API_PORT=${TOOL_API_PORT:-8081}
    command: ["/bot/tool-api"]
    ports:
      - "8081:8081"
    depends_on:
      - qdrant