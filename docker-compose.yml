version: "3.8"

services:
  madrookbot:
    # The image tag will be replaced by the GitHub Actions workflow
    image: ghcr.io/korjavin/madrookbot:latest
    container_name: madrookbot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - GPT_TOKEN=${GPT_TOKEN}
      - GPT_KEYWORDS=${GPT_KEYWORDS}
      - GPT_SYSTEM_PROMPT=${GPT_SYSTEM_PROMPT}
      - GPT_MODEL=${GPT_MODEL}
      - GPT_SYSTEM_MSG=${GPT_SYSTEM_MSG}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-1.0}
      - OPENAI_URL=${OPENAI_URL:-https://api.openai.com/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_IMAGE_MODEL=${GEMINI_IMAGE_MODEL:-gemini-2.5-flash-image-preview}
      - OWNER_ID=${OWNER_ID}
      - CLASS_GROUP_ID=${CLASS_GROUP_ID}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      - ELEVENLABS_VOICE_NAME=${ELEVENLABS_VOICE_NAME:-}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID}
      - REVIEW_PERCENTAGE=${REVIEW_PERCENTAGE:-1.0}
      - REVIEW_MIN_LENGTH=${REVIEW_MIN_LENGTH:-130}
      - REVIEW_PROMPT=${REVIEW_PROMPT:-}
    volumes:
      - ./data:/bot/data
    restart: unless-stopped
    depends_on:
      - qdrant
      - tool-api

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  tool-api:
    image: python:3.10-slim
    container_name: tool-api
    restart: unless-stopped
    environment:
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    command: tail -f /dev/null
